name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The pure-logic suites import no harness package, so a checkout of
      # deepseek-harness is not needed here; `pnpm typecheck` is a local
      # developer check against a harness checkout's built declarations.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: bundle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same step a git install runs through `prepare`.
      - run: pnpm run build
      # The peers only exist inside a dsh profile install, so the bundle is
      # checked structurally instead of imported.
      - run: node scripts/check-bundle.cjs
